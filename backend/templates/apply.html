<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for {{ job.role }} - HireFast</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #f8fafc;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>

<body class="p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-2xl w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold mb-2">{{ job.company_name or 'HireFast Partner' }}</h1>
            <p class="text-blue-400 text-xl font-medium">Applying for {{ job.role }}</p>
            {% if job.location %}
            <p class="text-gray-400 mt-1"><i class="fas fa-map-marker-alt mr-2"></i>{{ job.location }}</p>
            {% endif %}
        </div>

        <div class="glass rounded-3xl p-8 shadow-2xl">
            <div class="mb-8 p-6 bg-gray-900 rounded-2xl border border-gray-800">
                <h2 class="text-lg font-bold mb-4 text-gray-300">Job Description</h2>
                <div class="text-gray-400 text-sm whitespace-pre-wrap leading-relaxed">
                    {{ job.job_description }}
                </div>
            </div>

            <form id="applyForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Full Name *</label>
                    <input type="text" id="name" name="name" class="form-input w-full" placeholder="John Doe" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-input w-full" placeholder="john@example.com"
                        required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Resume (PDF Only) *</label>
                    <div class="border-2 border-dashed border-gray-700 rounded-2xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer"
                        onclick="document.getElementById('resume').click()">
                        <i class="fas fa-cloud-upload-alt text-4xl mb-3 text-gray-500"></i>
                        <p id="fileName" class="text-sm text-gray-400">Click to upload or drag and drop</p>
                        <input type="file" id="resume" name="resume" class="hidden" accept=".pdf" required
                            onchange="updateFileName(this)">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-primary w-full py-4 rounded-2xl font-bold text-lg">
                    Submit Application
                </button>
            </form>
            <div id="status" class="mt-6 hidden text-center p-4 rounded-xl"></div>
        </div>
    </div>

    <script>
        function updateFileName(input) {
            const fileName = input.files[0] ? input.files[0].name : 'Click to upload or drag and drop';
            document.getElementById('fileName').innerText = fileName;
        }

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const status = document.getElementById('status');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Submitting...';

            const formData = new FormData(e.target);

            try {
                const response = await fetch(window.location.pathname, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                status.classList.remove('hidden');
                if (data.success) {
                    status.className = 'mt-6 text-center p-4 rounded-xl bg-green-900 bg-opacity-20 text-green-400 border border-green-800';
                    status.innerText = 'Success! Your application has been submitted.';
                    e.target.reset();
                    document.getElementById('fileName').innerText = 'Click to upload or drag and drop';
                } else {
                    status.className = 'mt-6 text-center p-4 rounded-xl bg-red-900 bg-opacity-20 text-red-400 border border-red-800';
                    status.innerText = 'Error: ' + (data.error || 'Failed to submit');
                }
            } catch (err) {
                status.classList.remove('hidden');
                status.className = 'mt-6 text-center p-4 rounded-xl bg-red-900 bg-opacity-20 text-red-400 border border-red-800';
                status.innerText = 'Error: Connection failed';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Submit Application';
            }
        });
    </script>
</body>

</html>
